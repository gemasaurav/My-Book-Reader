<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Mobile Compatible Reader</title>
  <style>
    :root {
      --bg: #f5f0e6;
      --text: #2c2c2c;
      --toolbar-bg: #2c2c2c;
      --toolbar-text: #f5f0e6;
      --accent: #8b5a2b;
      --popup-bg: #ffffff;
      --popup-shadow: 0 8px 32px rgba(0,0,0,0.3);
      --selection: rgba(139, 90, 43, 0.4);
      --font-size: 18px;
      --line-height: 1.75;
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --text: #e8e0d5;
      --toolbar-bg: #0d0d0d;
      --toolbar-text: #e8e0d5;
      --accent: #c9a66b;
      --popup-bg: #2a2a2a;
      --popup-shadow: 0 8px 32px rgba(0,0,0,0.65);
      --selection: rgba(201, 166, 107, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 100vw;
    }

    /* ===== Toolbar ===== */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--toolbar-bg);
      color: var(--toolbar-text);
      padding: 8px 10px;
      min-height: 50px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      gap: 4px;
    }

    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-center { flex: 1; justify-content: center; }

    #book-title {
      font-size: 13px;
      font-weight: 500;
      max-width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--toolbar-text);
      font-size: 17px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn:active { background: rgba(255,255,255,0.15); }
    .icon-btn:disabled { opacity: 0.35; pointer-events: none; }

    #page-info {
      font-size: 12px;
      opacity: 0.9;
      min-width: 60px;
      text-align: center;
    }

    /* ===== Screens ===== */
    .screen { flex: 1; overflow: hidden; position: relative; }
    .hidden { display: none !important; }

    /* Welcome */
    #welcome {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      overflow: auto;
    }
    .welcome-content { text-align: center; max-width: 340px; }
    .welcome-content h1 { font-size: 1.55rem; margin-bottom: 10px; color: var(--accent); }
    .welcome-content p { margin-bottom: 6px; opacity: 0.85; font-size: 0.95rem; }
    .hint { font-size: 0.82rem !important; margin: 14px 0 22px !important; opacity: 0.7 !important; }
    .primary-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(139,90,43,0.35);
    }
    .primary-btn:active { transform: scale(0.97); }
    .formats { margin-top: 26px; font-size: 0.8rem; opacity: 0.55; }

    /* Reader */
    #reader { background: var(--bg); display: flex; flex-direction: column; }

    #content-wrapper {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* TXT */
    #txt-content {
      padding: 20px 18px;
      max-width: 720px;
      margin: 0 auto;
      font-size: var(--font-size);
      line-height: var(--line-height);
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
      -webkit-user-select: text;
      min-height: 100%;
    }

    /* PDF – single page view */
    #pdf-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      min-height: 100%;
    }
    .pdf-page-wrapper {
      position: relative;
      box-shadow: 0 2px 14px rgba(0,0,0,0.18);
      background: #fff;
      max-width: 100%;
      margin: 0 auto;
      transform-origin: left center;
      transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.35s ease;
      backface-visibility: hidden;
    }
    .pdf-page-wrapper.turning-next {
      transform: perspective(1200px) rotateY(-75deg);
      opacity: 0.15;
    }
    .pdf-page-wrapper.turning-prev {
      transform: perspective(1200px) rotateY(75deg);
      opacity: 0.15;
    }
    .pdf-page-wrapper.enter-from-right {
      transform: perspective(1200px) rotateY(65deg);
      opacity: 0.2;
    }
    .pdf-page-wrapper.enter-from-left {
      transform: perspective(1200px) rotateY(-65deg);
      opacity: 0.2;
    }
    .pdf-page-wrapper.enter-active {
      transform: perspective(1200px) rotateY(0deg);
      opacity: 1;
    }
    .pdf-page-wrapper canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .textLayer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      overflow: hidden;
      line-height: 1;
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
    }
    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    /* EPUB */
    #epub-content {
      width: 100%;
      height: 100%;
      padding: 0;
    }
    #epub-content iframe { border: none; }

    /* Selection highlight */
    ::selection { background: var(--selection); }
    ::-moz-selection { background: var(--selection); }

    /* ===== Bottom nav (page turn) ===== */
    #bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--toolbar-bg);
      color: var(--toolbar-text);
      padding: 8px 16px;
      min-height: 52px;
      flex-shrink: 0;
      z-index: 90;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    .nav-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-width: 100px;
    }
    .nav-btn:active { opacity: 0.85; }
    .nav-btn:disabled { opacity: 0.35; pointer-events: none; background: #666; }

    /* ===== Floating Selection Bar ===== */
    #selection-bar {
      position: fixed;
      z-index: 250;
      display: flex;
      gap: 8px;
      background: var(--toolbar-bg);
      padding: 8px 10px;
      border-radius: 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transform: translateX(-50%);
      animation: barIn 0.18s ease;
    }
    @keyframes barIn {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .sel-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }
    .sel-btn:active { opacity: 0.85; }

    /* ===== Dictionary Popup ===== */
    #popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #popup {
      background: var(--popup-bg);
      color: var(--text);
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--popup-shadow);
      animation: popIn 0.22s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    #popup-header {
      padding: 16px 18px 10px;
      border-bottom: 1px solid rgba(128,128,128,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #popup-word {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: capitalize;
    }
    #popup-lang-badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    #popup-body {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    #popup-loading { text-align: center; padding: 20px; opacity: 0.7; }
    #popup-error { color: #c0392b; text-align: center; padding: 12px; }

    .meaning-item { margin-bottom: 14px; }
    .meaning-item .pos {
      font-size: 0.8rem;
      color: var(--accent);
      font-style: italic;
      margin-bottom: 4px;
      text-transform: capitalize;
    }
    .meaning-item .def { margin-bottom: 4px; }
    .meaning-item .example {
      font-size: 0.85rem;
      opacity: 0.75;
      font-style: italic;
      margin-top: 2px;
    }
    #popup-synonyms {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(128,128,128,0.2);
      font-size: 0.9rem;
    }
    #popup-footer {
      padding: 10px 18px 14px;
      text-align: center;
      opacity: 0.55;
      font-size: 0.75rem;
      border-top: 1px solid rgba(128,128,128,0.15);
    }

    /* Loading */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      gap: 16px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Swipe hint */
    .swipe-hint {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 50;
    }
    .swipe-hint.show { opacity: 1; }

    @media (max-width: 480px) {
      :root { --font-size: 17px; }
      #book-title { max-width: 90px; }
      .nav-btn { min-width: 85px; padding: 10px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Toolbar -->
    <header id="toolbar">
      <div class="toolbar-left">
        <button id="btn-open" class="icon-btn" title="Open file">📂</button>
        <span id="book-title">Mobile Compatible Reader</span>
      </div>
      <div class="toolbar-center">
        <span id="page-info"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-sound" class="icon-btn" title="Page turn sound">🔊</button>
        <button id="btn-font-down" class="icon-btn" title="Decrease font">A−</button>
        <button id="btn-font-up" class="icon-btn" title="Increase font">A+</button>
        <button id="btn-theme" class="icon-btn" title="Toggle theme">🌓</button>
      </div>
    </header>

    <input type="file" id="file-input" accept=".txt,.pdf,.epub,text/plain,application/pdf,application/epub+zip" hidden />

    <!-- Welcome -->
    <div id="welcome" class="screen">
      <div class="welcome-content">
        <h1>📖 Mobile Compatible Reader</h1>
        <p>Kindle-like reader for TXT, PDF & EPUB</p>
        <p class="hint">Select a word → English or Hindi meaning with synonyms<br>Tap outside popup to close</p>
        <button id="btn-open-welcome" class="primary-btn">Open a Book</button>
        <div class="formats">Supports: .txt · .pdf · .epub</div>
      </div>
    </div>

    <!-- Reader -->
    <main id="reader" class="screen hidden">
      <div id="content-wrapper">
        <div id="txt-content" class="hidden"></div>
        <div id="pdf-content" class="hidden"></div>
        <div id="epub-content" class="hidden"></div>
      </div>
      <div id="swipe-hint" class="swipe-hint">Swipe or use buttons to turn page</div>

      <!-- Bottom page navigation -->
      <div id="bottom-nav" class="hidden">
        <button id="btn-prev" class="nav-btn">◀ Previous</button>
        <button id="btn-next" class="nav-btn">Next ▶</button>
      </div>
    </main>

    <!-- Selection floating bar -->
    <div id="selection-bar" class="hidden">
      <button id="btn-meaning-en" class="sel-btn">English</button>
      <button id="btn-meaning-hi" class="sel-btn">Hindi</button>
    </div>

    <!-- Dictionary Popup -->
    <div id="popup-overlay" class="hidden">
      <div id="popup">
        <div id="popup-header">
          <span id="popup-word"></span>
          <span id="popup-lang-badge"></span>
        </div>
        <div id="popup-body">
          <div id="popup-loading" class="hidden">Looking up…</div>
          <div id="popup-error" class="hidden"></div>
          <div id="popup-meanings"></div>
          <div id="popup-synonyms" class="hidden">
            <strong>Synonyms:</strong>
            <span id="synonyms-list"></span>
          </div>
        </div>
        <div id="popup-footer">
          <small>Tap outside to close</small>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <p>Loading book…</p>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    // ---------- Init ----------
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("mcr-theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      fontSize = parseInt(localStorage.getItem("mcr-font") || "18", 10);
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      soundOn = localStorage.getItem("mcr-sound") !== "off";
      btnSound.textContent = soundOn ? "🔊" : "🔇";

      $("#btn-open").addEventListener("click", () => fileInput.click());
      $("#btn-open-welcome").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", handleFile);

      $("#btn-font-up").addEventListener("click", () => changeFont(2));
      $("#btn-font-down").addEventListener("click", () => changeFont(-2));
      $("#btn-theme").addEventListener("click", toggleTheme);
      btnSound.addEventListener("click", toggleSound);

      btnPrev.addEventListener("click", () => goPage(-1));
      btnNext.addEventListener("click", () => goPage(1));

      $("#btn-meaning-en").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); showMeaning("en"); });
      $("#btn-meaning-hi").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); showMeaning("hi"); });

      // Close popup only when tapping outside the white box
      popupOverlay.addEventListener("click", (e) => {
        if (e.target === popupOverlay) closePopup();
      });
      popupOverlay.addEventListener("touchend", (e) => {
        if (e.target === popupOverlay) {
          e.preventDefault();
          closePopup();
        }
      });

      // Selection handling – more reliable on mobile
      document.addEventListener("selectionchange", onSelectionChange);
      document.addEventListener("mouseup", onSelectionEnd);
      document.addEventListener("touchend", onSelectionEnd, { passive: true });

      // Swipe for page turn
      contentWrapper.addEventListener("touchstart", onTouchStart, { passive: true });
      contentWrapper.addEventListener("touchend", onTouchEnd, { passive: true });

      // Hide bar on scroll
      contentWrapper.addEventListener("scroll", () => hideSelectionBar(), { passive: true });
    });

    // ---------- File open ----------
    async function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const name = file.name.toLowerCase();
      showLoading(true);
      hideAllContent();
      hideSelectionBar();
      closePopup();

      try {
        if (name.endsWith(".txt") || file.type === "text/plain") {
          await loadTxt(file);
          currentType = "txt";
        } else if (name.endsWith(".pdf") || file.type === "application/pdf") {
          await loadPdf(file);
          currentType = "pdf";
        } else if (name.endsWith(".epub") || file.type === "application/epub+zip") {
          await loadEpub(file);
          currentType = "epub";
        } else {
          alert("Unsupported format. Please use .txt, .pdf or .epub");
          showLoading(false);
          return;
        }

        bookTitle.textContent = file.name.replace(/\.[^.]+$/, "");
        welcome.classList.add("hidden");
        reader.classList.remove("hidden");
        updateNavVisibility();
        showSwipeHint();
      } catch (err) {
        console.error(err);
        alert("Failed to open file: " + (err.message || err));
      } finally {
        showLoading(false);
        fileInput.value = "";
      }
    }

    function hideAllContent() {
      txtContent.classList.add("hidden");
      pdfContent.classList.add("hidden");
      epubContent.classList.add("hidden");
      bottomNav.classList.add("hidden");
      txtContent.innerHTML = "";
      pdfContent.innerHTML = "";
      if (epubRendition) {
        try { epubRendition.destroy(); } catch (_) {}
        epubRendition = null;
      }
      epubContent.innerHTML = "";
      pdfDoc = null;
      pdfCurrentPage = 1;
      pdfTotalPages = 0;
      pageInfo.textContent = "";
    }

    function updateNavVisibility() {
      if (currentType === "pdf" || currentType === "epub") {
        bottomNav.classList.remove("hidden");
      } else {
        bottomNav.classList.add("hidden");
      }
      updatePageInfo();
    }

    function showSwipeHint() {
      if (currentType === "pdf" || currentType === "epub") {
        swipeHint.classList.add("show");
        setTimeout(() => swipeHint.classList.remove("show"), 2800);
      }
    }

    // ---------- TXT ----------
    async function loadTxt(file) {
      const text = await file.text();
      txtContent.textContent = text;
      txtContent.style.fontSize = fontSize + "px";
      txtContent.classList.remove("hidden");
      pageInfo.textContent = "TXT";
    }

    // ---------- PDF (single page + turn) ----------
    async function loadPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      pdfTotalPages = pdfDoc.numPages;
      pdfCurrentPage = 1;
      pdfContent.classList.remove("hidden");
      await renderPdfPage(pdfCurrentPage);
    }

    async function renderPdfPage(num, dir = 0) {
      if (!pdfDoc || num < 1 || num > pdfTotalPages) return;

      pdfContent.innerHTML = "";
      const page = await pdfDoc.getPage(num);
      const scale = Math.min(1.5, (window.innerWidth - 24) / page.getViewport({ scale: 1 }).width);
      const viewport = page.getViewport({ scale });

      const wrapper = document.createElement("div");
      wrapper.className = "pdf-page-wrapper";
      if (dir > 0) wrapper.classList.add("enter-from-right");
      else if (dir < 0) wrapper.classList.add("enter-from-left");
      wrapper.style.width = viewport.width + "px";
      wrapper.style.height = viewport.height + "px";

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const outputScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";
      ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
      wrapper.appendChild(canvas);

      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "textLayer";
      textLayerDiv.style.width = viewport.width + "px";
      textLayerDiv.style.height = viewport.height + "px";
      textLayerDiv.style.setProperty("--scale-factor", scale);
      wrapper.appendChild(textLayerDiv);

      pdfContent.appendChild(wrapper);

      await page.render({ canvasContext: ctx, viewport }).promise;

      // Text layer for selection
      try {
        const textContent = await page.getTextContent();
        const { TextLayer } = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
        const textLayer = new TextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport
        });
        await textLayer.render();
      } catch (err) {
        console.warn("TextLayer issue", err);
        // Fallback selectable text
        const textContent = await page.getTextContent();
        const fallback = document.createElement("div");
        fallback.style.cssText = "position:absolute;inset:0;color:transparent;font-size:2px;overflow:hidden;user-select:text;-webkit-user-select:text;line-height:1.2;";
        fallback.textContent = textContent.items.map(i => i.str).join(" ");
        textLayerDiv.appendChild(fallback);
      }

      pdfCurrentPage = num;
      updatePageInfo();
      contentWrapper.scrollTop = 0;

      // Trigger enter animation (page folds into place)
      if (dir !== 0) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            wrapper.classList.remove("enter-from-right", "enter-from-left");
            wrapper.classList.add("enter-active");
          });
        });
      }
    }

    // ---------- EPUB ----------
    async function loadEpub(file) {
      const arrayBuffer = await file.arrayBuffer();
      epubBook = ePub(arrayBuffer);
      epubContent.classList.remove("hidden");
      epubContent.innerHTML = "";

      epubRendition = epubBook.renderTo(epubContent, {
        width: "100%",
        height: "100%",
        flow: "paginated",          // page-by-page like Kindle
        manager: "default",
        allowScriptedContent: true
      });

      await epubRendition.display();

      epubRendition.themes.default({
        body: {
          "font-family": "Georgia, serif !important",
          "font-size": fontSize + "px !important",
          "line-height": "1.75 !important",
          "background": "var(--bg) !important",
          "color": "var(--text) !important",
          "padding": "16px !important"
        }
      });

      // Selection inside iframe
      epubRendition.hooks.content.register((contents) => {
        const doc = contents.document;
        doc.addEventListener("mouseup", () => handleEpubSelection(contents));
        doc.addEventListener("touchend", () => handleEpubSelection(contents));
        doc.addEventListener("selectionchange", () => handleEpubSelection(contents));
      });

      epubRendition.on("relocated", (location) => {
        updatePageInfo();
      });

      updatePageInfo();
    }

    function handleEpubSelection(contents) {
      try {
        const sel = contents.window.getSelection();
        const text = sel ? sel.toString().trim() : "";
        if (text && text.length > 0 && text.length < 60) {
          selectedText = cleanWord(text);
          const rect = epubContent.getBoundingClientRect();
          showSelectionBar(rect.left + rect.width / 2, rect.top + 80);
        }
      } catch (_) {}
    }

    // ---------- Page navigation ----------
    async function goPage(dir) {
      hideSelectionBar();

      if (currentType === "pdf") {
        const next = pdfCurrentPage + dir;
        if (next < 1 || next > pdfTotalPages) return;

        const oldWrapper = pdfContent.querySelector(".pdf-page-wrapper");
        if (oldWrapper) {
          // Start page-fold animation
          oldWrapper.classList.add(dir > 0 ? "turning-next" : "turning-prev");
          playPageSound();
          await new Promise(r => setTimeout(r, 280));
        } else {
          playPageSound();
        }

        await renderPdfPage(next, dir);

      } else if (currentType === "epub" && epubRendition) {
        playPageSound();
        if (dir > 0) await epubRendition.next();
        else await epubRendition.prev();
      }
      updatePageInfo();
    }

    function updatePageInfo() {
      if (currentType === "pdf") {
        pageInfo.textContent = `${pdfCurrentPage} / ${pdfTotalPages}`;
        btnPrev.disabled = pdfCurrentPage <= 1;
        btnNext.disabled = pdfCurrentPage >= pdfTotalPages;
      } else if (currentType === "epub" && epubRendition) {
        try {
          const loc = epubRendition.currentLocation();
          if (loc && loc.start) {
            const page = loc.start.displayed ? loc.start.displayed.page : "?";
            const total = loc.start.displayed ? loc.start.displayed.total : "?";
            pageInfo.textContent = `${page} / ${total}`;
          } else {
            pageInfo.textContent = "EPUB";
          }
        } catch (_) {
          pageInfo.textContent = "EPUB";
        }
        btnPrev.disabled = false;
        btnNext.disabled = false;
      } else {
        pageInfo.textContent = currentType === "txt" ? "TXT" : "";
      }
    }

    // ---------- Swipe ----------
    function onTouchStart(e) {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }
    function onTouchEnd(e) {
      if (!touchStartX || currentType === "txt") return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) goPage(1);   // swipe left → next
        else goPage(-1);         // swipe right → prev
      }
      touchStartX = 0;
    }

    // ---------- Selection (TXT + PDF) ----------
    let selectionTimer = null;

    function onSelectionChange() {
      clearTimeout(selectionTimer);
      selectionTimer = setTimeout(checkSelection, 120);
    }

    function onSelectionEnd(e) {
      // Don't hide if user is tapping our buttons
      if (e.target.closest("#selection-bar") || e.target.closest("#popup")) return;
      clearTimeout(selectionTimer);
      selectionTimer = setTimeout(checkSelection, 80);
    }

    function checkSelection() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) {
        // Only hide if popup is not open
        if (popupOverlay.classList.contains("hidden")) {
          // small delay so button taps can still work
          setTimeout(() => {
            if (window.getSelection().isCollapsed) hideSelectionBar();
          }, 200);
        }
        return;
      }

      const text = sel.toString().trim();
      if (text && text.length > 0 && text.length < 60) {
        selectedText = cleanWord(text);
        try {
          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          if (rect.width || rect.height) {
            // Place bar above or below selection so it stays visible on mobile
            let y = rect.bottom + 10;
            if (y > window.innerHeight - 70) y = rect.top - 55;
            showSelectionBar(rect.left + rect.width / 2, y);
          }
        } catch (_) {
          showSelectionBar(window.innerWidth / 2, window.innerHeight / 2);
        }
      }
    }

    function cleanWord(text) {
      const cleaned = text.replace(/[^\p{L}\p{N}'’-]/gu, " ").trim();
      const parts = cleaned.split(/\s+/);
      return parts.slice(0, 3).join(" ") || cleaned;
    }

    function showSelectionBar(x, y) {
      selectionBar.classList.remove("hidden");
      const barW = 200;
      const left = Math.max(barW / 2 + 10, Math.min(x, window.innerWidth - barW / 2 - 10));
      const top = Math.max(10, Math.min(y, window.innerHeight - 70));
      selectionBar.style.left = left + "px";
      selectionBar.style.top = top + "px";
    }

    function hideSelectionBar() {
      selectionBar.classList.add("hidden");
    }

    // ---------- Dictionary ----------
    async function showMeaning(lang) {
      if (!selectedText) return;

      // Keep a copy because selection may clear
      const word = selectedText;
      hideSelectionBar();
      openPopup(word, lang);

      const loading = $("#popup-loading");
      const errorEl = $("#popup-error");
      const meaningsEl = $("#popup-meanings");
      const synonymsEl = $("#popup-synonyms");
      const synonymsList = $("#synonyms-list");

      loading.classList.remove("hidden");
      errorEl.classList.add("hidden");
      meaningsEl.innerHTML = "";
      synonymsEl.classList.add("hidden");

      try {
        if (lang === "en") {
          await fetchEnglishMeaning(word, meaningsEl, synonymsEl, synonymsList);
        } else {
          await fetchHindiMeaning(word, meaningsEl, synonymsEl, synonymsList);
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Could not find meaning. Try selecting a single word.";
        errorEl.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
      }
    }

    async function fetchEnglishMeaning(word, meaningsEl, synonymsEl, synonymsList) {
      const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Not found");
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) throw new Error("No data");

      const entry = data[0];
      const allSynonyms = new Set();

      entry.meanings.forEach((m) => {
        const pos = m.partOfSpeech || "";
        m.definitions.slice(0, 3).forEach((d) => {
          const item = document.createElement("div");
          item.className = "meaning-item";
          item.innerHTML = `
            <div class="pos">${pos}</div>
            <div class="def">${escapeHtml(d.definition)}</div>
            ${d.example ? `<div class="example">“${escapeHtml(d.example)}”</div>` : ""}
          `;
          meaningsEl.appendChild(item);
        });
        (m.synonyms || []).forEach(s => allSynonyms.add(s));
        m.definitions.forEach(d => (d.synonyms || []).forEach(s => allSynonyms.add(s)));
      });

      if (allSynonyms.size) {
        synonymsList.textContent = [...allSynonyms].slice(0, 12).join(", ");
        synonymsEl.classList.remove("hidden");
      }
    }

    async function fetchHindiMeaning(word, meaningsEl, synonymsEl, synonymsList) {
      let engDefs = [];
      let engSyns = [];
      try {
        const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data[0]) {
            data[0].meanings.forEach((m) => {
              m.definitions.slice(0, 2).forEach(d => engDefs.push(d.definition));
              (m.synonyms || []).forEach(s => engSyns.push(s));
            });
          }
        }
      } catch (_) {}

      const wordHi = await translateToHindi(word);
      const defsHi = [];
      for (const def of engDefs.slice(0, 2)) {
        const t = await translateToHindi(def);
        if (t) defsHi.push(t);
      }

      const item = document.createElement("div");
      item.className = "meaning-item";
      item.innerHTML = `
        <div class="pos">शब्द / Word</div>
        <div class="def"><strong>${escapeHtml(word)}</strong> → ${escapeHtml(wordHi || "—")}</div>
      `;
      meaningsEl.appendChild(item);

      if (defsHi.length) {
        defsHi.forEach((d, i) => {
          const el = document.createElement("div");
          el.className = "meaning-item";
          el.innerHTML = `
            <div class="pos">अर्थ ${i + 1}</div>
            <div class="def">${escapeHtml(d)}</div>
          `;
          meaningsEl.appendChild(el);
        });
      } else if (!wordHi) {
        throw new Error("Translation failed");
      }

      if (engSyns.length) {
        const synHi = [];
        for (const s of engSyns.slice(0, 5)) {
          const t = await translateToHindi(s);
          if (t) synHi.push(t);
        }
        if (synHi.length) {
          synonymsList.textContent = synHi.join(", ");
          synonymsEl.classList.remove("hidden");
        }
      }
    }

    async function translateToHindi(text) {
      if (!text || text.length > 350) return null;
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|hi`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.responseData?.translatedText) return data.responseData.translatedText;
      } catch (e) {
        console.warn("Translate error", e);
      }
      return null;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // ---------- Popup ----------
    function openPopup(word, lang) {
      $("#popup-word").textContent = word;
      $("#popup-lang-badge").textContent = lang === "en" ? "English" : "हिन्दी";
      popupOverlay.classList.remove("hidden");
    }

    function closePopup() {
      popupOverlay.classList.add("hidden");
      try { window.getSelection()?.removeAllRanges(); } catch (_) {}
    }

    // ---------- UI helpers ----------
    function showLoading(show) {
      loadingOverlay.classList.toggle("hidden", !show);
    }

    function changeFont(delta) {
      fontSize = Math.max(14, Math.min(28, fontSize + delta));
      document.documentElement.style.setProperty("--font-size", fontSize + "px");
      // Also apply directly so it works even if CSS variable is delayed
      if (txtContent) {
        txtContent.style.fontSize = fontSize + "px";
      }
      localStorage.setItem("mcr-font", String(fontSize));
      if (epubRendition) {
        try {
          epubRendition.themes.fontSize(fontSize + "px");
          epubRendition.themes.override("font-size", fontSize + "px", true);
        } catch (_) {}
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("mcr-theme", next);
      if (epubRendition) {
        epubRendition.themes.default({
          body: {
            "background": next === "dark" ? "#1a1a1a !important" : "#f5f0e6 !important",
            "color": next === "dark" ? "#e8e0d5 !important" : "#2c2c2c !important"
          }
        });
      }
    }

    function toggleSound() {
      soundOn = !soundOn;
      btnSound.textContent = soundOn ? "🔊" : "🔇";
      localStorage.setItem("mcr-sound", soundOn ? "on" : "off");
      if (soundOn) playPageSound();
    }
  </script>
</body>
